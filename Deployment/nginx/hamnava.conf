# ==========================================================================
# HAMNAVA — NGINX REVERSE PROXY CONFIGURATION (UBUNTU 22.04 / 24.04)
# Domain: https://hamnavamusic.ir (Dashboard: /dashboard/)
# Proxies exclusively to local Kestrel on 127.0.0.1:5000
# ==========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name hamnavamusic.ir www.hamnavamusic.ir;

    # Allow Let's Encrypt ACME verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://hamnavamusic.ir$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hamnavamusic.ir;

    ssl_certificate /etc/letsencrypt/live/hamnavamusic.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hamnavamusic.ir/privkey.pem;

    return 301 https://hamnavamusic.ir$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hamnavamusic.ir;

    ssl_certificate /etc/letsencrypt/live/hamnavamusic.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hamnavamusic.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:HamnavaSSL:10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Support student performance video uploads (120 MB app limit + multipart overhead)
    client_max_body_size 150M;
    client_body_timeout 180s;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml font/woff2;

    # Block direct exposure of sensitive hidden files
    location ~ /\. {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
