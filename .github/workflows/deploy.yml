name: Deploy to Server

on:
push:
branches:
- master

env:
DOTNET_VERSION: "10.0.x"
APP_PORT: "5001"
ASPNETCORE_ENVIRONMENT: "Production"
BASE_DIR: "/home/amin/User/Projects/Dotnet/Publish" 

jobs:
deploy:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup .NET
    uses: actions/setup-dotnet@v4
    with:
      dotnet-version: ${{ env.DOTNET_VERSION }}

  - name: Publish
    run: |
      dotnet publish \
        -c Release \
        -r linux-x64 \
        --no-self-contained \
        -o out

  - name: Debug Publish Output
    run: |
      echo "===== Publish Files ====="
      ls -lah out

  - name: Upload Files
    uses: appleboy/scp-action@v0.1.7
    with:
      host: ${{ secrets.HOST }}
      username: ${{ secrets.USERNAME }}
      key: ${{ secrets.SSH_PRIVATE_KEY }}
      source: "out/*"
      target: "${{ env.BASE_DIR }}/${{ github.event.repository.name }}"

  - name: Restart Application
    uses: appleboy/ssh-action@v1.2.0
    with:
      host: ${{ secrets.HOST }}
      username: ${{ secrets.USERNAME }}
      key: ${{ secrets.SSH_PRIVATE_KEY }}
      command_timeout: 20m
      script: |
        set -Eeuo pipefail

        APP_NAME="${{ github.event.repository.name }}"
        BASE_DIR="${{ env.BASE_DIR }}"
        APP_PORT="${{ env.APP_PORT }}"
        ENVIRONMENT="${{ env.ASPNETCORE_ENVIRONMENT }}"

        APP_DIR="$BASE_DIR/$APP_NAME"
        LOG_FILE="$APP_DIR/app.log"
        PID_FILE="$APP_DIR/app.pid"

        echo "================================"
        echo "APP_NAME=$APP_NAME"
        echo "APP_DIR=$APP_DIR"
        echo "APP_PORT=$APP_PORT"
        echo "================================"

        mkdir -p "$APP_DIR"

        echo "Stopping old application..."

        PID=$(lsof -t -i:$APP_PORT || true)

        if [ -n "$PID" ]; then
          echo "Killing PID $PID"
          kill -9 "$PID"
          sleep 3
        fi

        cd "$APP_DIR"

        echo "Current files:"
        ls -lah

        if [ ! -f "$APP_NAME.dll" ]; then
          echo "ERROR: $APP_NAME.dll not found"
          exit 1
        fi

        echo "Starting application..."

        nohup env \
          ASPNETCORE_ENVIRONMENT="$ENVIRONMENT" \
          ASPNETCORE_URLS="http://0.0.0.0:$APP_PORT" \
          dotnet "$APP_NAME.dll" \
          > "$LOG_FILE" 2>&1 &

        echo $! > "$PID_FILE"

        sleep 5

        if ps -p $(cat "$PID_FILE") > /dev/null
        then
          echo "Application Started Successfully"
          echo "PID: $(cat "$PID_FILE")"
        else
          echo "Application Failed To Start"
          cat "$LOG_FILE"
          exit 1
        fi

        echo "================================"
        echo "Deploy Completed Successfully"
        echo "================================"
