name: Deploy to Server

on:
  push:
    branches:
      - master

env:
  DOTNET_VERSION: "10.0.x"
  PUBLISH_COMMAND: "dotnet publish -c Release -r linux-x64 --no-self-contained -o out"
  # مقدار پیش‌فرض گلوبال APP_NAME (در صورت نبودن override)
  APP_NAME_GLOBAL: "hamnavamusic"
  APP_PORT: "5001"
  ASPNETCORE_ENVIRONMENT: "Production"
  BASE_DIR: "/home/amin/User/Projects/Dotnet/Publish"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # تعریف APP_NAME نهایی در سطح job با fallback به اسم مخزن
    env:
      APP_NAME: ${{ env.APP_NAME_GLOBAL || github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: |
          echo "Running publish command:"
          echo "${{ env.PUBLISH_COMMAND }}"
          ${{ env.PUBLISH_COMMAND }}

      - name: Debug publish output
        run: |
          echo "out directory content:"
          ls -lah out

      - name: Upload to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # کل پوشه out را کپی می‌کند (نه فقط محتویات)
          source: "out/"
          target: "${{ env.BASE_DIR }}/${{ env.APP_NAME }}"

      - name: Restart App
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -Eeuo pipefail

            trap '
              EXIT_CODE=$?
              echo "========================================="
              echo "DEPLOY FAILED"
              echo "Exit Code: $EXIT_CODE"
              echo "Line: $LINENO"
              echo "Command: $BASH_COMMAND"
              echo "========================================="
              exit $EXIT_CODE
            ' ERR

            # مقدار APP_NAME از متغیر محیطی job گرفته می‌شود
            APP_NAME="${{ env.APP_NAME }}"
            BASE_DIR="${{ env.BASE_DIR }}"
            BASE_DIR="${BASE_DIR:-/home/amin/User/Projects/Dotnet/Publish}"

            APP_PORT="${{ env.APP_PORT }}"
            APP_PORT="${APP_PORT:-5002}"

            ENVIRONMENT="${{ env.ASPNETCORE_ENVIRONMENT }}"
            ENVIRONMENT="${ENVIRONMENT:-Production}"

            APP_DIR="$BASE_DIR/$APP_NAME"
            LOG_FILE="$APP_DIR/app.log"
            PID_FILE="$APP_DIR/app.pid"

            echo "APP_DIR=$APP_DIR"
            echo "APP_PORT=$APP_PORT"

            mkdir -p "$APP_DIR"

            echo "Stopping old process..."
            PID=$(lsof -t -i:$APP_PORT || true)

            if [ -n "$PID" ]; then
              echo "Killing PID: $PID"
              kill -9 "$PID" || true
              sleep 3
            fi

            # وارد پوشه out می‌شویم (چون کل پوشه out آپلود شده)
            cd "$APP_DIR/out"

            # بررسی نوع فایل خروجی (با توجه به --no-self-contained انتظار dll داریم)
            if [ -f "$APP_NAME.dll" ]; then
              echo "Starting with dotnet (framework-dependent)..."
              nohup env \
                ASPNETCORE_ENVIRONMENT="$ENVIRONMENT" \
                ASPNETCORE_URLS="http://127.0.0.1:$APP_PORT" \
                dotnet "$APP_NAME.dll" \
                > "$LOG_FILE" 2>&1 &
            elif [ -f "$APP_NAME" ]; then
              echo "Starting as executable (self-contained)..."
              chmod +x "$APP_NAME"
              nohup env \
                ASPNETCORE_ENVIRONMENT="$ENVIRONMENT" \
                ASPNETCORE_URLS="http://127.0.0.1:$APP_PORT" \
                ./"$APP_NAME" \
                > "$LOG_FILE" 2>&1 &
            else
              echo "Error: No executable or DLL found for $APP_NAME"
              exit 1
            fi

            echo $! > "$PID_FILE"
            echo "Started PID: $(cat $PID_FILE)"